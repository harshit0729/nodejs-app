name: CI/CD Pipeline

on:
  push:
    branches: [ mern-ec2-docker-ssl ]
  pull_request:
    branches: [ mern-ec2-docker-ssl ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint 2>/dev/null || echo "No lint script"

      - name: Build
        run: npm run build 2>/dev/null || echo "No build script"

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm install --prefix client

      - name: Build React app
        run: npm run build --prefix client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        run: |
          docker tag netflix-server harshittjainn/nodejs-app:latest
          docker push harshittjainn/nodejs-app:latest

      - name: Push frontend image
        run: |
          docker tag netflix-client harshittjainn/reactjs-app:latest
          docker push harshittjainn/reactjs-app:latest